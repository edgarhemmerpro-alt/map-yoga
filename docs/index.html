<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre communauté à travers le monde</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  /* Texte : Open Sans — Titres : Satoshi Bold. Auto-hébergés (aucun appel tiers). */
  @font-face{font-family:'Open Sans';font-weight:400;font-display:swap;src:url(fonts/open-sans-400.woff2) format('woff2')}
  @font-face{font-family:'Open Sans';font-weight:600;font-display:swap;src:url(fonts/open-sans-600.woff2) format('woff2')}
  @font-face{font-family:'Open Sans';font-weight:700;font-display:swap;src:url(fonts/open-sans-700.woff2) format('woff2')}
  @font-face{font-family:'Satoshi';font-weight:700;font-display:swap;src:url(fonts/satoshi-700.woff2) format('woff2')}

  :root{
    --creme:#F8F6F3; --panneau:#EFEBE3; --terre:#E3DED2; --trait:#D5CFC0;
    --vert:#3C5133; --vert-clair:#4C6742; --encre:#17171A; --gris:#78756D;
    --blanc:#fff; --ombre:0 4px 24px rgba(30,28,20,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Open Sans',system-ui,sans-serif;background:var(--creme);color:var(--encre);-webkit-font-smoothing:antialiased}

  .enveloppe{display:grid;grid-template-columns:300px 1fr;gap:44px;
    align-items:center;padding:40px;min-height:100vh;max-width:1440px;margin:0 auto}

  /* ---------- panneau gauche ---------- */
  h1{font-family:'Satoshi','Open Sans',sans-serif;font-size:34px;line-height:1.18;
    font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
  .sous{font-size:14px;line-height:1.55;color:var(--gris);margin-bottom:38px;max-width:26ch}
  .stat{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .rond{width:44px;height:44px;border-radius:50%;background:var(--panneau);
    display:grid;place-items:center;flex:0 0 44px}
  .rond svg{width:19px;height:19px;stroke:var(--encre);stroke-width:1.5;fill:none}
  .stat b{display:block;font-size:16px;font-weight:600;line-height:1.3}
  .stat span{display:block;font-size:13px;color:var(--gris);line-height:1.4}

  /* ---------- carte ---------- */
  .cadre{position:relative;height:calc(100vh - 80px);min-height:520px;
    border-radius:20px;overflow:hidden;background:var(--creme)}
  #carte{position:absolute;inset:0;background:var(--creme);outline:none}
  .leaflet-container{font-family:inherit;background:var(--creme)}

  .pays{fill:var(--terre);stroke:var(--trait);stroke-width:.7}
  /* couches de detail (France) revelees progressivement au zoom, servies
     depuis le repo : toujours aucune requete vers un tiers */
  .region{fill:none;stroke:#C9C2B0;stroke-width:.9}
  .dept{fill:none;stroke:#CBC4B3;stroke-width:.55;stroke-dasharray:2 2}
  .commune{fill:var(--vert);fill-opacity:.05;stroke:var(--vert-clair);
    stroke-width:1;stroke-opacity:.55}

  /* pastilles de regroupement */
  .grappe{background:var(--vert);color:#fff;border-radius:50%;
    display:grid;place-items:center;font-size:13px;font-weight:600;
    box-shadow:0 2px 10px rgba(40,60,35,.35);border:2px solid rgba(255,255,255,.55);
    transition:transform .15s}
  .grappe:hover{transform:scale(1.08)}
  /* zone de clic large et invisible : cible tactile confortable */
  .point{width:28px;height:28px;display:grid;place-items:center;cursor:pointer}
  .point::before{content:"";width:14px;height:14px;border-radius:50%;
    background:#26261F;border:2px solid rgba(255,255,255,.8);
    box-shadow:0 1px 4px rgba(30,28,20,.35);transition:transform .15s}
  .point:hover::before{transform:scale(1.35)}

  /* boutons flottants */
  .zoom{position:absolute;top:16px;left:16px;z-index:600;background:var(--blanc);
    border-radius:11px;box-shadow:var(--ombre);overflow:hidden}
  .zoom button{display:block;width:34px;height:34px;border:0;background:none;
    font-size:17px;color:var(--encre);cursor:pointer;line-height:34px}
  .zoom button:hover{background:var(--panneau)}
  .zoom button+button{border-top:1px solid #EDE9E0}

  .flottant{position:absolute;z-index:600;background:var(--blanc);border:0;
    border-radius:11px;box-shadow:var(--ombre);cursor:pointer;
    font:500 13px 'Open Sans',sans-serif;color:var(--encre);
    display:flex;align-items:center;gap:8px;padding:11px 15px}
  .flottant:hover{background:#FCFBF8}
  .flottant svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none}
  #bFiltres{top:16px;right:16px}
  #bPosition{bottom:16px;right:16px}

  /* recherche d'adresse */
  .recherche{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:600;
    display:flex;align-items:center;gap:7px;background:var(--blanc);border-radius:11px;
    box-shadow:var(--ombre);padding:5px 6px 5px 13px;width:min(340px,calc(100% - 150px))}
  .recherche>svg{width:15px;height:15px;stroke:var(--gris);stroke-width:1.7;fill:none;flex:0 0 15px}
  .recherche input{flex:1;min-width:0;border:0;background:none;outline:none;
    font:400 13px 'Open Sans',sans-serif;color:var(--encre)}
  .recherche input::placeholder{color:var(--gris)}
  .recherche button{flex:0 0 auto;border:0;border-radius:8px;background:var(--vert);color:#fff;
    font:600 12px 'Open Sans',sans-serif;padding:8px 13px;cursor:pointer;transition:background .15s}
  .recherche button:hover{background:var(--vert-clair)}
  .recherche button:disabled{opacity:.55;cursor:default}
  /* épingle de l'adresse recherchée */
  .pin-adr{width:16px;height:16px;border-radius:50%;background:var(--vert);
    border:3px solid var(--blanc);box-shadow:0 2px 8px rgba(40,60,35,.45)}

  /* panneau filtres */
  #filtres{position:absolute;top:60px;right:16px;z-index:601;width:216px;
    background:var(--blanc);border-radius:14px;box-shadow:var(--ombre);
    padding:16px;display:none}
  #filtres.ouvert{display:block}
  #filtres h2{font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.09em;color:var(--gris);margin:0 0 9px}
  #filtres h2+h2{margin-top:16px}
  #filtres label{display:flex;align-items:center;gap:8px;font-size:13px;
    padding:3px 0;cursor:pointer}
  #filtres input{accent-color:var(--vert);width:14px;height:14px}
  #filtres select{width:100%;font:400 13px 'Open Sans',sans-serif;padding:7px 9px;
    border:1px solid #E6E2D8;border-radius:8px;background:var(--blanc);color:var(--encre)}
  #raz{margin-top:14px;width:100%;padding:8px;border:0;border-radius:8px;
    background:var(--panneau);font:500 12px 'Open Sans',sans-serif;cursor:pointer;color:var(--encre)}
  #raz:hover{background:#E7E2D8}

  /* fiche prof */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--ombre);padding:0}
  .leaflet-popup-content{margin:0;width:224px!important;font-size:13px}
  .leaflet-popup-tip{box-shadow:none}
  .leaflet-popup-close-button{color:var(--gris)!important;font-size:19px!important;
    padding:9px 9px 0 0!important}
  .fiche{display:flex;gap:12px;padding:14px}
  .av{width:56px;height:56px;border-radius:10px;flex:0 0 56px;background:var(--panneau);
    display:grid;place-items:center;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:contain;padding:8px}
  .av b{font-size:17px;font-weight:600;color:var(--vert);letter-spacing:.02em}
  .fiche h3{font-size:14px;font-weight:600;margin:0 0 1px;padding-right:14px}
  .lieu{font-size:11.5px;color:var(--gris);margin-bottom:9px}
  .liens{display:flex;gap:8px;margin-top:10px}
  .liens a{font-size:11.5px;font-weight:500;color:var(--vert);text-decoration:none;
    border-bottom:1px solid rgba(60,81,51,.28);padding-bottom:1px}
  .liens a:hover{border-bottom-color:var(--vert)}

  .legende{position:absolute;bottom:16px;left:16px;z-index:600;font-size:11.5px;
    color:var(--gris);background:rgba(248,246,243,.85);padding:6px 11px;border-radius:8px;
    max-width:calc(100% - 32px)}

  /* animation markercluster (extrait minimal, evite d'embarquer la CSS complete) */
  .leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{
    transition:transform .25s cubic-bezier(0,0,.25,1),opacity .25s}

  @media (max-width:900px){
    .enveloppe{grid-template-columns:1fr;gap:26px;padding:22px}
    h1{font-size:26px}.sous{margin-bottom:24px}
    .stat{margin-bottom:14px}
    .cadre{height:56vh;min-height:340px}
  }
  @media (max-width:600px){
    /* carte moins haute sur téléphone ; recherche pleine largeur en haut,
       zoom + Filtres passent juste en dessous pour éviter tout chevauchement */
    .cadre{height:50vh;min-height:300px}
    .recherche{top:16px;left:16px;right:16px;transform:none;width:auto}
    .zoom{top:64px}
    #bFiltres{top:64px}
    #filtres{top:108px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--vert);outline-offset:2px}
</style>
</head>
<body>
<div class="enveloppe">
  <div>
    <h1>Notre communauté<br>à travers le monde</h1>
    <p class="sous">Trouvez un professeur Change Perspective près de chez vous.</p>

    <div class="stat"><div class="rond"><svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg></div>
      <div><b id="nbProfs">—</b><span>Professeurs référencés</span></div></div>

    <div class="stat"><div class="rond"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg></div>
      <div><b id="nbPays">—</b><span>Pays</span></div></div>

    <div class="stat"><div class="rond"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      <div><b>Une communauté</b><span>Engagée et bienveillante</span></div></div>

    <div class="stat"><div class="rond"><svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></div>
      <div><b>Formés selon</b><span>la méthode CPY</span></div></div>
  </div>

  <div class="cadre">
    <div id="carte" role="application" aria-label="Carte des professeurs"></div>

    <form class="recherche" id="recherche" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="adresse" type="text" autocomplete="off"
             placeholder="Votre adresse, ville…" aria-label="Rechercher une adresse">
      <button type="submit" id="bChercher">Chercher</button>
    </form>

    <div class="zoom">
      <button id="zPlus"  aria-label="Zoomer">+</button>
      <button id="zMoins" aria-label="Dézoomer">−</button>
    </div>

    <button class="flottant" id="bFiltres" aria-expanded="false">Filtres
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>

    <div id="filtres" role="group" aria-label="Filtres">
      <h2>Pays</h2><select id="selPays"><option value="">Tous les pays</option></select>
      <button id="raz">Tout afficher</button>
    </div>

    <button class="flottant" id="bPosition">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      Ma position</button>

    <div class="legende" id="legende">Cliquez sur un point pour découvrir le professeur.</div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script>
(function(){
  "use strict";
  var carte = L.map('carte', {
    zoomControl:false, attributionControl:false,
    minZoom:2, maxZoom:12, worldCopyJump:true,
    center:[26,6], zoom:2
  });

  document.getElementById('zPlus').onclick  = function(){ carte.zoomIn(); };
  document.getElementById('zMoins').onclick = function(){ carte.zoomOut(); };

  // Fond de carte rendu depuis le repo : aucune requête vers un fournisseur
  // de tuiles, donc aucune IP de visiteur transmise à un tiers.
  //
  // Détail progressif : les contours France (régions → départements →
  // communes) n'apparaissent qu'en zoomant, pour rester épuré de loin et
  // donner des repères une fois plongé sur une ville. Tout est servi depuis
  // le repo, la règle « zéro requête tierce » tient toujours.
  var couches = {};
  var SEUILS = { pays:0, region:5, dept:7, commune:10 };  // zoom d'apparition
  var ORDRE = ['pays','region','dept','commune'];         // empilement (pays au fond)

  function chargeFond(fichier, cls, cle){
    return fetch(fichier).then(function(r){ return r.json(); }).then(function(g){
      couches[cle] = L.geoJSON(g, {
        interactive:false,
        style:function(){ return {className:cls}; }
      });
    });
  }

  function majFond(){
    var z = carte.getZoom();
    ORDRE.forEach(function(cle){
      var c = couches[cle]; if(!c) return;
      var visible = z >= SEUILS[cle];
      if(visible && !carte.hasLayer(c)) c.addTo(carte);
      else if(!visible && carte.hasLayer(c)) carte.removeLayer(c);
    });
    ORDRE.forEach(function(cle){                 // réordonne les contours visibles
      if(couches[cle] && carte.hasLayer(couches[cle])) couches[cle].bringToFront();
    });
  }

  Promise.all([
    chargeFond('world.geojson',        'pays',    'pays'),
    chargeFond('fr-regions.geojson',   'region',  'region'),
    chargeFond('fr-departements.geojson','dept',  'dept'),
    chargeFond('fr-communes.geojson',  'commune', 'commune')
  ]).then(majFond);
  carte.on('zoomend', majFond);

  var groupes = L.markerClusterGroup({
    maxClusterRadius:44,
    showCoverageOnHover:false,
    spiderfyDistanceMultiplier:1.4,
    iconCreateFunction:function(c){
      var n = c.getChildCount(), t = n<10?34:n<50?40:46;
      return L.divIcon({ html:'<div class="grappe" style="width:'+t+'px;height:'+t+'px">'+n+'</div>',
                         className:'', iconSize:[t,t] });
    }
  });

  function el(t, cls, texte){
    var n = document.createElement(t);
    if(cls) n.className = cls;
    if(texte != null) n.textContent = texte;   // textContent : jamais d'injection
    return n;
  }

  function lienSur(u){                       // n'accepte que http(s), coupe javascript:
    try{ var p = new URL(u); return (p.protocol==='https:'||p.protocol==='http:') ? p.href : null; }
    catch(e){ return null; }
  }

  // Construite en DOM et non par concaténation : les noms, villes et pseudos
  // viennent d'un formulaire public, ils ne doivent jamais être interprétés
  // comme du HTML.
  function fiche(p){
    var f = el('div','fiche');
    var av = el('div','av');

    if(p.ico){
      var img = el('img');
      img.src = p.ico; img.alt = ''; img.loading = 'lazy';
      img.onerror = function(){ av.replaceChildren(el('b', null, p.ini || '?')); };
      av.appendChild(img);
    } else {
      av.appendChild(el('b', null, p.ini || '?'));
    }
    f.appendChild(av);

    var d = el('div');
    d.appendChild(el('h3', null, p.nom));
    d.appendChild(el('div','lieu', (p.ville||'') + (p.pays ? ', '+p.pays : '')));

    var s = p.site ? lienSur(p.site) : null,
        i = p.insta ? lienSur(p.insta) : null;
    if(s || i){
      var box = el('div','liens');
      [[s,'Site'],[i,'Instagram']].forEach(function(x){
        if(!x[0]) return;
        var a = el('a', null, x[1]);
        a.href = x[0]; a.target = '_blank';
        a.rel = 'noopener noreferrer nofollow';
        box.appendChild(a);
      });
      d.appendChild(box);
    }
    f.appendChild(d);
    return f;
  }

  var tous = [];

  fetch('profs.geojson').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('nbProfs').textContent = (d.stats&&d.stats.profs) || d.features.length;
    document.getElementById('nbPays').textContent  = (d.stats&&d.stats.pays)  || '';

    d.features.forEach(function(f){
      var p = f.properties, c = f.geometry.coordinates;
      var lon = c[0], lat = c[1];
      // garde-fou : une coordonnée hors plage (fichier corrompu) est ignorée
      // plutôt que de projeter le marqueur hors carte
      if(!(lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180)) return;
      var m = L.marker([c[1],c[0]], {
        icon: L.divIcon({className:'', html:'<div class="point"></div>',
                         iconSize:[28,28], iconAnchor:[14,14]}),
        keyboard:true, title:p.nom
      });
      m.bindPopup(fiche(p), {closeButton:true, offset:[0,-2], maxWidth:240});
      m.props = p;
      tous.push(m);
    });

    // filtre construit depuis les données réelles, pas une liste figée
    var pays = {};
    tous.forEach(function(m){
      if(m.props.pays) pays[m.props.pays]=(pays[m.props.pays]||0)+1;
    });

    var sp = document.getElementById('selPays');
    Object.keys(pays).sort().forEach(function(k){
      sp.appendChild(el('option', null, k + ' (' + pays[k] + ')')).value = k;
    });

    sp.addEventListener('change', appliquer);
    document.getElementById('raz').onclick = function(){ sp.value=''; appliquer(); };

    appliquer();
    carte.addLayer(groupes);
  }).catch(function(){
    document.getElementById('legende').textContent =
      'Les données de la carte n’ont pas pu être chargées. Réessayez dans un instant.';
  });

  function appliquer(){
    var pays = document.getElementById('selPays').value;
    var gardes = tous.filter(function(m){ return !pays || m.props.pays===pays; });
    groupes.clearLayers();
    groupes.addLayers(gardes);
    document.getElementById('legende').textContent = gardes.length
      ? gardes.length+' professeur'+(gardes.length>1?'s':'')+' · cliquez sur un point'
      : 'Aucun professeur ne correspond à ces filtres.';
  }

  var bf = document.getElementById('bFiltres'), pf = document.getElementById('filtres');
  bf.onclick = function(e){
    e.stopPropagation();
    var o = pf.classList.toggle('ouvert');
    bf.setAttribute('aria-expanded', o);
  };
  document.addEventListener('click', function(e){
    if(!pf.contains(e.target) && e.target!==bf){ pf.classList.remove('ouvert'); bf.setAttribute('aria-expanded',false); }
  });

  // Géolocalisation : l'API du navigateur demande le consentement, et la
  // position ne quitte jamais la page (aucun appel réseau).
  document.getElementById('bPosition').onclick = function(){
    var b = this, l = document.getElementById('legende');
    if(!navigator.geolocation){ l.textContent='Votre navigateur ne gère pas la géolocalisation.'; return; }
    b.disabled = true;
    navigator.geolocation.getCurrentPosition(function(pos){
      b.disabled = false;
      carte.flyTo([pos.coords.latitude, pos.coords.longitude], 7, {duration:1.1});
      var moi = L.latLng(pos.coords.latitude, pos.coords.longitude), meilleur=null, dmin=Infinity;
      tous.forEach(function(m){
        var d = moi.distanceTo(m.getLatLng());
        if(d<dmin){ dmin=d; meilleur=m; }
      });
      if(meilleur) l.textContent = 'Le plus proche : '+meilleur.props.nom+' à '
        + Math.round(dmin/1000) + ' km ('+meilleur.props.ville+').';
    }, function(){
      b.disabled = false;
      l.textContent = 'Position indisponible. Autorisez la géolocalisation dans votre navigateur.';
    }, {timeout:8000});
  };

  // Recherche d'adresse -> zoom sur les profs les plus proches.
  // Géocodage via la Base Adresse Nationale (service public FR, sans clé) ;
  // repli sur OpenStreetMap pour une adresse hors de France (ex : voyage).
  // C'est le seul appel réseau vers un tiers de la page, déclenché uniquement
  // quand le visiteur lance une recherche.
  function geocodeAdresse(q){
    var ban = 'https://api-adresse.data.gouv.fr/search/?limit=1&q=' + encodeURIComponent(q);
    return fetch(ban).then(function(r){ return r.json(); }).then(function(d){
      var f = (d.features || [])[0];
      if(f && f.properties && f.properties.score >= 0.4){
        var c = f.geometry.coordinates;               // [lon, lat]
        return { lat:c[1], lon:c[0] };
      }
      var osm = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
      return fetch(osm).then(function(r){ return r.json(); }).then(function(a){
        return (a && a[0]) ? { lat:parseFloat(a[0].lat), lon:parseFloat(a[0].lon) } : null;
      });
    });
  }

  var pinAdr = null;
  document.getElementById('recherche').addEventListener('submit', function(e){
    e.preventDefault();
    var q = document.getElementById('adresse').value.trim();
    var l = document.getElementById('legende'), btn = document.getElementById('bChercher');
    if(!q) return;
    btn.disabled = true; l.textContent = 'Recherche de « ' + q + ' »…';
    geocodeAdresse(q).then(function(res){
      btn.disabled = false;
      if(!res){ l.textContent = "Adresse introuvable. Précisez la ville ou le code postal."; return; }
      var moi = L.latLng(res.lat, res.lon);
      if(pinAdr) carte.removeLayer(pinAdr);
      pinAdr = L.marker(moi, { interactive:false, keyboard:false, zIndexOffset:1000,
        icon:L.divIcon({ className:'', html:'<div class="pin-adr"></div>',
                         iconSize:[16,16], iconAnchor:[8,8] }) }).addTo(carte);

      // profs actuellement affichés (respecte le filtre pays), triés par distance
      var affiches = tous.filter(function(m){ return groupes.hasLayer(m); });
      var liste = (affiches.length ? affiches : tous).map(function(m){
        return { m:m, d:moi.distanceTo(m.getLatLng()) };
      }).sort(function(a,b){ return a.d - b.d; });

      if(!liste.length){ carte.flyTo(moi, 11, {duration:1.1}); return; }
      var pts = liste.slice(0, 5).map(function(x){ return x.m.getLatLng(); });
      pts.push(moi);
      carte.flyToBounds(L.latLngBounds(pts).pad(0.25), {duration:1.1, maxZoom:12});
      var p0 = liste[0];
      l.textContent = 'Le plus proche : ' + p0.m.props.nom + ' à '
        + Math.round(p0.d/1000) + ' km (' + p0.m.props.ville + ').';
    }).catch(function(){
      btn.disabled = false;
      l.textContent = "La recherche a échoué. Réessayez dans un instant.";
    });
  });
})();
</script>
</body>
</html>
